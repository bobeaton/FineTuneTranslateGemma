<!DOCTYPE html>
<html>
  <head>
    <title>TranslateGemma — {{ MODEL_NAME }}</title>
    <style>
      html { box-sizing: border-box; font-family: system-ui, sans-serif; }
      *, *:before, *:after { box-sizing: inherit; }
      body { margin: 1.5rem; max-width: 70rem; }
      #wrapper { display: grid; grid-template-columns: 1fr auto 1fr; grid-column-gap: 1em; align-items: start; }
      #input, #output { width: 100%; min-height: 10em; border: 1px solid grey; font-size: 1.1rem; padding: 0.5rem; }
      #output { white-space: pre-wrap; background: #f8f8f8; }
      select, button { font-size: 1rem; padding: 0.25rem; }
      #swapButton { margin-top: 4em; }
      #translateButton { font-size: 1rem; margin-top: 0.5em; }
      #status { color: #666; font-style: italic; }
      #endpoints { font-family: monospace; }
    </style>
  </head>
  <body>
    <h1>TranslateGemma translation service</h1>
    <p>Model: <code>{{ MODEL_NAME }}</code></p>
    <div id="wrapper">
      <div>
        <h2>Source</h2>
        <select id="inputLanguage" name="inputLanguage"></select>
        <textarea id="input"></textarea>
        <button id="translateButton">Translate</button>
        <span id="status"></span>
      </div>
      <div>
        <button id="swapButton" title="Swap languages">&#8646;</button>
      </div>
      <div>
        <h2>Target</h2>
        <select id="outputLanguage" name="outputLanguage"></select>
        <div id="output"></div>
      </div>
    </div>
    <h2>API</h2>
    <ul id="endpoints">
      <li>GET /api/v1/translate/languages/ &rarr; ["code", ...]</li>
      <li>POST /api/v1/translate/ with {sourceLanguage, targetLanguage, text[, directionForward]} &rarr; {originalText, translatedText}</li>
    </ul>
    <script>
      async function start() {
        const response = await fetch(`${location.origin}/api/v1/translate/languages/names/`, {
          headers: { "Content-Type": "application/json" },
        });
        const languages = await response.json();
        const codes = Object.keys(languages).sort();
        for (const code of codes) {
          for (const select of [inputLanguage, outputLanguage]) {
            const option = document.createElement("option");
            option.value = code;
            option.textContent = languages[code] === code ? code : `${code} — ${languages[code]}`;
            select.appendChild(option);
          }
        }
        inputLanguage.value = codes.includes("hi") ? "hi" : codes[0];
        outputLanguage.value = codes.includes("xnr") ? "xnr" : codes[0];
      }
      start();
      swapButton.addEventListener("click", () => {
        const t = inputLanguage.value;
        inputLanguage.value = outputLanguage.value;
        outputLanguage.value = t;
      });
      translateButton.addEventListener("click", async () => {
        const data = {
          sourceLanguage: inputLanguage.value,
          targetLanguage: outputLanguage.value,
          text: input.value,
        };
        translateButton.disabled = true;
        status.textContent = "translating…";
        const started = Date.now();
        try {
          const response = await fetch(`${location.origin}/api/v1/translate/`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data),
          });
          const responseBody = await response.json();
          if (!response.ok) {
            console.error(response);
            alert("Error: " + (responseBody.error || response.statusText));
          }
          output.textContent = responseBody.translatedText;
          status.textContent = `${((Date.now() - started) / 1000).toFixed(1)}s`;
        } catch (e) {
          console.error(e);
          alert("Error: " + e);
          status.textContent = "";
        } finally {
          translateButton.disabled = false;
        }
      });
    </script>
  </body>
</html>
